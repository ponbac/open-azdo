trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  OpenCodeModel: openai/gpt-5.4-mini
  OpenCodeThinking: high
  BunVersion: 1.4.4
  BunLinuxX64Sha256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
  OpenCodeVersion: 2.2.3
  OpenCodeLinuxX64Sha256: ef3aeeaf5522b10d69a3da7bbd6e6d8d259f845833d96b8310767d3407b18a35

steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    persistCredentials: false

  - bash: |
      set -euo pipefail

      curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v$(BunVersion)/bun-linux-x64.zip" -o bun.zip
      echo "$(BunLinuxX64Sha256)  bun.zip" | sha256sum -c -
      unzip -q bun.zip
      export PATH="$PWD/bun-linux-x64:$PATH"

      curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v$(OpenCodeVersion)/opencode-linux-x64.tar.gz" -o opencode.tar.gz
      echo "$(OpenCodeLinuxX64Sha256)  opencode.tar.gz" | sha256sum -c -
      mkdir -p opencode-bin
      tar -xzf opencode.tar.gz -C opencode-bin
      export PATH="$PWD/opencode-bin:$PATH"

      bun x open-azdo review --model "$(OpenCodeModel)" --opencode-variant "$(OpenCodeThinking)"
    displayName: Review Pull Request
    env:
      # Azure Pipelines: enable "Allow scripts to access the OAuth token".
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      OPENAI_API_KEY: $(OPENAI_API_KEY)
      OPEN_AZDO_OPENCODE_TIMEOUT: "15 minutes"
